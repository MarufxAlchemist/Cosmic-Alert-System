##############################################################################
# nginx.conf — Transient Event Detection frontend reverse proxy
#
# Responsibilities:
#   1. Serve the Vite-built static files (SPA — React)
#   2. Proxy /api/* HTTP requests → api-server:8000
#   3. Proxy /api/ws WebSocket upgrade → api-server:8000
#
# This replaces the Vite dev-server proxy (vite.config.ts → server.proxy)
# which is only active during development. In the container, Vite has already
# built the static bundle; nginx takes over serving and proxying duties.
##############################################################################

server {
    listen 5173;
    server_name _;

    # ── Static SPA files ──────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # React Router / Wouter — all non-file paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket upgrade: /api/ws ─────────────────────────────────────────────
    # Must come BEFORE the generic /api/ location so it matches first.
    location /api/ws {
        proxy_pass         http://api-server:8000;
        proxy_http_version 1.1;

        # WebSocket handshake headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── REST API proxy: /api/* ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api-server:8000;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Disable buffering for SSE / streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
