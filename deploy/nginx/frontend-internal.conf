##############################################################################
# nginx.conf — Transient Event Detection frontend (serve-only, production)
#
# Used ONLY in docker-compose.prod.yml via volume override:
#   volumes:
#     - ./deploy/nginx/frontend-internal.conf:/etc/nginx/conf.d/astro-sentinel.conf:ro
#
# In production, the top-level nginx proxy (deploy/nginx/nginx.conf) handles:
#   • /api/* routing to api-server
#   • /api/ws WebSocket upgrades
#   • Security headers, rate limiting, gzip
#
# This file only serves the static Vite bundle with SPA fallback.
# It intentionally has NO api proxy — that responsibility belongs to the
# top-level nginx reverse proxy.
##############################################################################

server {
    listen 5173;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # React Router / Wouter: all unknown paths serve index.html.
    # The browser-side router handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset cache hints ──────────────────────────────────────────────
    # Vite injects content hashes into filenames (e.g., main.abc123.js).
    # Long-lived cache headers are safe for these files.
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── No access log (top-level nginx logs all traffic) ──────────────────────
    access_log off;
    error_log  /dev/stderr warn;
}
