##############################################################################
# deploy/nginx/nginx.conf
# Top-level reverse proxy for Transient Event Detection
#
# Responsibilities
# ────────────────
#   • Single public entry point for all web traffic (ports 80 / 443)
#   • Route /api/ws  → api-server WebSocket
#   • Route /api/*   → api-server HTTP (rate limited by endpoint type)
#   • Route /        → frontend container (static SPA)
#   • Security headers, gzip, cache control
#   • Rate limiting per zone (general API, auth, AI analysis)
#   • ACME challenge passthrough for Let's Encrypt
#   • HTTPS server block ready — uncomment after certificates are obtained
#
# Internal services (api-server, frontend, python-backend, postgres) are
# NOT exposed on host ports. Only this nginx proxy exposes 80 and 443.
#
# Monitoring endpoints
#   GET /health/api      → api-server /api/healthz  (Prometheus can scrape this)
#   GET /health/frontend → frontend nginx ping
##############################################################################

worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
    use                epoll;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;   # Do not expose nginx version in headers or error pages

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # General API: 100 req/min per IP — reasonable for authenticated users
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    # Auth endpoints: 10 req/min — prevents brute force login attempts
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    # AI analysis: 20 req/min — expensive Gemini calls, protect quota
    limit_req_zone $binary_remote_addr zone=api_ai:10m      rate=20r/m;

    # ── Structured access log ─────────────────────────────────────────────────
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct="$upstream_connect_time" '
        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Upstream pools ────────────────────────────────────────────────────────
    upstream frontend_pool {
        server  frontend:5173;
        keepalive 16;
    }

    upstream api_pool {
        server  api-server:8000;
        keepalive 32;
    }

    upstream python_pool {
        server  python-backend:8001;
        keepalive 8;
    }

    # ── Common proxy headers (reused across location blocks) ──────────────────
    # NOTE: add_header directives in server {} apply unless overridden in location {}
    # We set them in each location to be explicit and avoid inheritance surprises.

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTP SERVER — works immediately without SSL certificates
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Let's Encrypt ACME challenge ─────────────────────────────────────
        # certbot --webroot uses this path to verify domain ownership.
        # This must remain on port 80 even after SSL is configured.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
        }

        # Once SSL is working, replace the block below with:
        #   location / { return 301 https://$host$request_uri; }
        # and move all other locations to the HTTPS server block below.

        # ── Security headers (applied to all responses) ──────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options   "nosniff"                           always;
        add_header X-XSS-Protection         "1; mode=block"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # Content-Security-Policy: allows Google OAuth, ORCID, Google Fonts
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: https:; "
            "connect-src 'self' wss: ws: https://accounts.google.com https://orcid.org https://pub.orcid.org; "
            "frame-src https://accounts.google.com;"
            always;

        # ── WebSocket upgrade: /api/ws ───────────────────────────────────────
        # MUST come before the generic /api/ location — nginx uses first match.
        location /api/ws {
            proxy_pass          http://api_pool;
            proxy_http_version  1.1;

            # WebSocket handshake
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  "upgrade";

            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;

            # Long timeouts — WebSocket connections are persistent
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }

        # ── AI correlation analysis (expensive, lower rate limit) ─────────────
        location ~ ^/api/events/[0-9]+/correlations {
            limit_req       zone=api_ai burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          http://api_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_buffering     off;

            # AI responses can take 30-60s — extend timeout
            proxy_connect_timeout  10s;
            proxy_read_timeout     120s;
        }

        # ── Auth endpoints (strict rate limit: 10 req/min) ───────────────────
        location ~ ^/api/auth {
            limit_req       zone=api_auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass          http://api_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
        }

        # ── General API (100 req/min) ─────────────────────────────────────────
        location /api/ {
            limit_req       zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass          http://api_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_buffering     off;
            proxy_cache         off;
        }

        # ── Health endpoints for monitoring (Prometheus, UptimeRobot, etc.) ──
        location = /health/api {
            access_log  off;
            proxy_pass  http://api_pool/api/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health/python {
            access_log  off;
            proxy_pass  http://python_pool/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Static assets with cache headers ─────────────────────────────────
        # Vite adds content hashes to filenames — long-lived cache is safe.
        location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass          http://frontend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;

            add_header Cache-Control "public, max-age=604800, immutable" always;
            access_log off;
        }

        # ── SPA frontend (catch-all) ──────────────────────────────────────────
        location / {
            proxy_pass          http://frontend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_buffering     off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTPS SERVER — uncomment after obtaining SSL certificates
    #
    # Step-by-step SSL setup:
    #
    #   1. Set DOMAIN in your .env:  DOMAIN=your-domain.com
    #
    #   2. Obtain a certificate via Certbot (webroot method):
    #      docker compose -f docker-compose.prod.yml exec nginx \
    #        certbot certonly --webroot \
    #          -w /var/www/certbot \
    #          -d your-domain.com \
    #          --email admin@your-domain.com \
    #          --agree-tos --non-interactive
    #
    #   3. Uncomment the HTTPS server block below.
    #      Update `server_name` to your domain.
    #
    #   4. In the HTTP server block above, replace all location blocks
    #      with this single redirect:
    #        location / { return 301 https://$host$request_uri; }
    #      (keep the /.well-known/acme-challenge/ block for renewals)
    #
    #   5. Reload nginx:
    #      docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
    #
    # ═══════════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # ── SSL certificates (from Let's Encrypt / Certbot) ─────────────────
    #     ssl_certificate      /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key  /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    #
    #     # ── Modern SSL configuration ────────────────────────────────────────
    #     ssl_protocols               TLSv1.2 TLSv1.3;
    #     ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers   off;
    #     ssl_session_timeout         1d;
    #     ssl_session_cache           shared:SSL:10m;
    #     ssl_session_tickets         off;
    #
    #     # ── OCSP Stapling ──────────────────────────────────────────────────
    #     ssl_stapling                on;
    #     ssl_stapling_verify         on;
    #     resolver                    1.1.1.1 8.8.8.8 valid=300s;
    #     resolver_timeout            5s;
    #
    #     # ── HSTS (enable only after confirming HTTPS works perfectly) ───────
    #     # WARNING: max-age=31536000 = 1 year. Cannot be easily undone.
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ── Same security headers as HTTP block ─────────────────────────────
    #     add_header X-Frame-Options        "SAMEORIGIN"                       always;
    #     add_header X-Content-Type-Options "nosniff"                          always;
    #     add_header X-XSS-Protection       "1; mode=block"                    always;
    #     add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    #
    #     # ── ACME challenge passthrough (needed for renewals) ────────────────
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #         try_files $uri =404;
    #         access_log off;
    #     }
    #
    #     # ── Copy all location blocks from the HTTP server above ────────────
    #     # (WebSocket, AI, Auth, API, Health, Static, SPA)
    # }
}
