openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Transient Event Detection API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Astronomical event operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List latest astronomical events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: eventType
          in: query
          schema:
            type: string
            enum: [GRB, GW, FRB]
        - name: observatory
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"

  /events/stats:
    get:
      operationId: getEventStats
      tags: [events]
      summary: Get aggregate stats about events
      responses:
        "200":
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStats"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstroEvent"
        "404":
          description: Event not found

  /events/{id}/localizations:
    get:
      operationId: getEventLocalizations
      tags: [events]
      summary: List sky localizations for a GW event
      description: |
        Returns all localization records for the given event (ordered by
        version descending, latest first).  Returns an empty array when no
        FITS sky-map has been ingested for this event.
      parameters:
        - name: id
          in: path
          required: true
          description: Primary key of the event (core.events.id)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: List of localization records (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventLocalization"
        "400":
          description: Invalid event ID

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EventLocalization:
      type: object
      description: Sky localization metadata for a gravitational-wave event
      properties:
        id:
          type: string
          description: Primary key (bigserial, serialised as string)
        eventId:
          type: string
          description: FK to core.events.id (serialised as string)
        fitsUrl:
          type: string
          description: URL to the FITS sky-map file on GraceDB
        method:
          type: string
          description: Localisation pipeline (e.g. bayestar, lalinference)
        version:
          type: integer
          description: Monotonically increasing revision number (1-based)
        isLatest:
          type: boolean
          description: True for the most recent localization for this event
        nside:
          type: integer
          nullable: true
          description: HEALPix NSIDE resolution parameter
        area50Deg2:
          type: number
          nullable: true
          description: 50th-percentile credible region area (deg²)
        area90Deg2:
          type: number
          nullable: true
          description: 90th-percentile credible region area (deg²)
        vol50Mpc3:
          type: number
          nullable: true
          description: 50th-percentile credible volume (Mpc³)
        vol90Mpc3:
          type: number
          nullable: true
          description: 90th-percentile credible volume (Mpc³)
        hasNsProb:
          type: number
          nullable: true
          description: Probability that at least one binary component is a neutron star
        createdAt:
          type: string
          description: UTC ISO timestamp of row insertion
      required:
        - id
        - eventId
        - fitsUrl
        - method
        - version
        - isLatest
        - createdAt

    AstroEvent:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
          description: Human-readable event ID (e.g. GRB260503A)
        eventType:
          type: string
          enum: [GRB, GW, FRB]
        observatory:
          type: string
        detectionTime:
          type: string
          description: ISO timestamp with microsecond precision
        ra:
          type: number
          nullable: true
          description: OBSERVED Right Ascension in degrees (ICRS). null = position not reported by source.
        dec:
          type: number
          nullable: true
          description: OBSERVED Declination in degrees (ICRS). null = position not reported by source.
        errorRadius:
          type: number
          nullable: true
          description: OBSERVED localization uncertainty in arcminutes. null = not reported. Semantics are source-defined.
        snr:
          type: number
          nullable: true
          description: OBSERVED signal-to-noise ratio. null = not reported (IceCube reports signalness instead).
        far:
          type: number
          nullable: true
          description: OBSERVED false alarm rate (Hz). null = not reported. Zero is unphysical and never stored.
        signalness:
          type: number
          nullable: true
          description: OBSERVED IceCube signalness - probability in [0,1] that the event is astrophysical. NOT an SNR.
        fluence:
          type: number
          nullable: true
          description: Fluence (erg/cm²), GRB only
        dm:
          type: number
          nullable: true
          description: Dispersion measure (pc/cm³), FRB only
        t90:
          type: number
          nullable: true
          description: T90 duration (s), GRB only
        peakFlux:
          type: number
          nullable: true
          description: Peak Flux, FRB and GRB
        chirpMass:
          type: number
          nullable: true
          description: Chirp mass (solar masses), GW only
        luminosityDistance:
          type: number
          nullable: true
          description: Luminosity distance (Mpc), GW only
        galLat:
          type: number
          nullable: true
          description: >-
            DERIVED Galactic latitude in degrees (ICRS -> Galactic, astropy).
            null means UNKNOWN - could not be responsibly derived.
        galLon:
          type: number
          nullable: true
          description: >-
            DERIVED Galactic longitude in degrees (ICRS -> Galactic, astropy).
            null means UNKNOWN - could not be responsibly derived.
        sunDistance:
          type: number
          nullable: true
          description: >-
            DERIVED angular separation from the Sun in degrees, evaluated in
            GCRS at the detection epoch (astropy get_body). null means UNKNOWN -
            never a placeholder value.
        moonDistance:
          type: number
          nullable: true
          description: >-
            DERIVED angular separation from the Moon in degrees, evaluated in
            GCRS at the detection epoch (astropy get_body). null means UNKNOWN -
            never a placeholder value.
        latencyUs:
          type: integer
          nullable: true
          description: >-
            MEASURED ingestion latency in microseconds, from detectionTime to
            receipt. null means UNKNOWN - the alert was never received live
            (e.g. an archive import), so there is no latency to report. Never
            a placeholder value.
        createdAt:
          type: string
        lifecycle:
          type: string
          enum: [preliminary, initial, update, confirmed]
          description: Normalised alert lifecycle state
        alertType:
          type: string
          nullable: true
          description: Raw alert_type string from originating source (e.g. PRELIMINARY, RETRACTION)
        classificationTier:
          type: string
          enum: [GOLD, BRONZE]
          nullable: true
          description: IceCube classification tier
      required:
        - id
        - eventId
        - eventType
        - observatory
        - detectionTime
        - ra
        - dec
        - errorRadius
        - snr
        - far
        - galLat
        - galLon
        - sunDistance
        - moonDistance
        - latencyUs
        - createdAt
        - lifecycle

    EventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AstroEvent"
        total:
          type: integer
      required:
        - events
        - total

    EventStats:
      type: object
      properties:
        totalEvents:
          type: integer
        byType:
          type: object
          properties:
            GRB:
              type: integer
            GW:
              type: integer
            FRB:
              type: integer
          required: [GRB, GW, FRB]
        byObservatory:
          type: array
          items:
            type: object
            properties:
              observatory:
                type: string
              count:
                type: integer
            required: [observatory, count]
        recentRate:
          type: number
          description: Events per hour in the last hour
        latestEvent:
          $ref: "#/components/schemas/AstroEvent"
          nullable: true
      required:
        - totalEvents
        - byType
        - byObservatory
        - recentRate
